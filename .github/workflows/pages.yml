name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1" # weekly, to refresh the data files
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: node --test tests/site.test.mjs
      - name: Build site data (Zillow, Census, ZIP locations, emergency services)
        # Each file is built independently; anything that fails shows a notice on the site.
        continue-on-error: true
        run: python scripts/build_site_data.py docs/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
