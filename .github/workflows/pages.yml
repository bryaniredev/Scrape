name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1" # weekly, to refresh the data files
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: node --test tests/site.test.mjs tests/homes.test.mjs
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site data (Zillow, Census, ZIP locations, emergency services)
        # Each file is built independently; anything that fails shows a notice on the site.
        continue-on-error: true
        env:
          # Optional repo secret; without it the build falls back to Census Reporter.
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          # Optional repo secret for the FBI agency list; DEMO_KEY is enough for this one call.
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          # Fallback: reuse a file from the live site if its source is down right now.
          PREVIOUS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build_site_data.py docs/data
      - name: Cache-bust scripts so browsers load this deploy's version
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s#src=\"app.js\"#src=\"app.js?v=$v\"#; s#href=\"style.css\"#href=\"style.css?v=$v\"#" docs/index.html
          sed -i "s#from \"./homes.js\"#from \"./homes.js?v=$v\"#" docs/app.js
          grep -q "app.js?v=$v" docs/index.html
          grep -q "homes.js?v=$v" docs/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
