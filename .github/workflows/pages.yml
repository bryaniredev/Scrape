name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1" # weekly, to refresh Zillow data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: node --test tests/
      - name: Build Zillow home value data
        # If Zillow is unreachable the site still deploys; that section shows a notice.
        continue-on-error: true
        run: python scripts/build_zhvi.py docs/data/zhvi_pa.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
